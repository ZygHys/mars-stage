<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>火星舞台</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #c9d3dc; font: 13px/1.4 "PingFang SC", system-ui, sans-serif; }
  #app { position: fixed; inset: 0; }
  
  #loader { position: fixed; inset: 0; z-index: 50; overflow: hidden; color: #f1f2f6; background: #05060d; font-family: "PingFang SC", system-ui, sans-serif; }
  #loader .ldSky { position: absolute; inset: 0; }
  #loader .ldSky canvas { display: block; }
  #loader .ldCenter { position: absolute; left: 50%; bottom: 16%; transform: translateX(-50%); width: min(440px, 82vw); text-align: center; }
  #loader .ldTitle b { display: block; font: 600 clamp(30px, 7vw, 56px)/1.1 "Didot", "Bodoni 72", "Times New Roman", serif; letter-spacing: .04em; }
  #loader .ldTitle span { display: block; margin-top: 10px; font-size: 13px; color: #b9bdd0; letter-spacing: .22em; }
  #loader .ldBar { height: 3px; margin: 24px auto 10px; border-radius: 2px; background: rgba(255,255,255,.14); overflow: hidden; }
  #loader .ldBar i { display: block; height: 100%; transform-origin: 0 50%; transform: scaleX(.03); background: linear-gradient(90deg, #5ab8f0, #f07ab8, #f4d24a); }
  #loader .ldText { font-size: 12px; color: #c9ccd8; letter-spacing: .12em; animation: ldPulse 1.6s ease-in-out infinite; }
  @keyframes ldPulse { 0%, 100% { opacity: .5; } 50% { opacity: 1; } }
  #app > canvas { display: block; }   
  .labels { position: absolute; inset: 0; pointer-events: none; }
  .tag { padding: 2px 6px; border-radius: 4px; background: rgba(0,0,0,.62); color: #fff; font-size: 12px; white-space: nowrap; }
  
  #ui { position: fixed; left: 12px; top: calc(10px + env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; gap: 6px; max-width: calc(100vw - 24px); z-index: 5; }
  #ui[hidden] { display: none; }
  #ui .bar { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; padding: 4px; border-radius: 10px; background: rgba(14,15,18,.62); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); align-self: flex-start; max-width: 100%; }
  #ui button, #ui select { font: inherit; font-size: 12.5px; padding: 5px 9px; border-radius: 7px; border: 0; background: rgba(255,255,255,.08); color: #eee; cursor: pointer; }
  #ui button:hover, #ui select:hover { background: rgba(255,255,255,.16); }
  #ui .seg { display: inline-flex; gap: 2px; padding: 2px; border-radius: 8px; background: rgba(0,0,0,.35); }
  #ui .seg button { background: transparent; }
  #ui button.on, #ui .seg button.on { background: #c0392b; color: #fff; }
  #ui .tab.on { background: rgba(255,255,255,.9); color: #111; }
  #ui #view { max-width: 13em; }
  #ui .clock { color: #cfd3da; font-size: 12px; padding: 0 6px; font-variant-numeric: tabular-nums; }
  #ui .panel { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px; border-radius: 10px; background: rgba(14,15,18,.72); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); align-self: flex-start; max-width: min(760px, 100%); }
  #ui .panel[hidden] { display: none; }
  #ui label { color: #d9dce2; font-size: 12px; display: inline-flex; gap: 6px; align-items: center; padding-left: 4px; }
  #ui label select { max-width: 18em; }
  #ui .sceneTime { min-height: 30px; }
  #sceneClock { min-width: 5ch; font-variant-numeric: tabular-nums; color: #fff; }
  #sceneTime { width: clamp(90px, 22vw, 240px); accent-color: #e49e66; cursor: pointer; }
  #ui .hint { color: #e8eaee; line-height: 1.7; font-size: 12.5px; }
  #ui .hint b { color: #fff; margin-right: 6px; }
  
  .hud { position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; gap: 14px; padding: 6px 14px; border-radius: 10px; background: rgba(10,11,14,.55); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); color: #fff; font: 600 13px/1.2 "PingFang SC", system-ui, sans-serif; font-variant-numeric: tabular-nums; pointer-events: none; z-index: 4; white-space: nowrap; }
  .hud[hidden] { display: none; }
  .hud i { font-style: normal; font-weight: 400; color: #9fb4c8; margin-right: 4px; font-size: 11px; }
  
  .minimap { position: fixed; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); padding: 6px; border-radius: 10px; background: rgba(14,15,18,.7); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); color: #ddd; font: 11px "PingFang SC", system-ui, sans-serif; z-index: 4; }
  .minimap[hidden] { display: none; }
  .minimap .mmHead { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 4px; }
  .minimap .mmToggle { font: inherit; border: 0; border-radius: 6px; padding: 2px 8px; background: rgba(255,255,255,.12); color: #eee; cursor: pointer; }
  .minimap canvas { display: block; border-radius: 6px; cursor: crosshair; }
  .minimap .mmTip { height: 14px; margin-top: 3px; color: #ffd65a; font-variant-numeric: tabular-nums; }
  
  #app > canvas { touch-action: none; }
  .touchUI { position: fixed; inset: 0; pointer-events: none; z-index: 4; }
  .touchUI .tcStick { position: absolute; left: calc(18px + env(safe-area-inset-left, 0px)); bottom: calc(62px + env(safe-area-inset-bottom, 0px)); width: 128px; height: 128px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.10), rgba(10,11,14,.38)); border: 1.5px solid rgba(255,255,255,.45); pointer-events: auto; touch-action: none; display: grid; place-items: center; }
  .touchUI .tcStick.on { border-color: rgba(255,214,90,.9); }
  .touchUI .tcKnob { width: 54px; height: 54px; border-radius: 50%; background: rgba(255,255,255,.78); box-shadow: 0 2px 10px rgba(0,0,0,.35); }
  .touchUI .tcBtns { position: absolute; right: calc(18px + env(safe-area-inset-right, 0px)); bottom: calc(70px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; pointer-events: auto; }
  .touchUI .tcBtns button { width: 58px; height: 58px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.5); background: rgba(10,11,14,.45); color: #fff; font: 600 18px "PingFang SC", system-ui, sans-serif; touch-action: none; -webkit-user-select: none; user-select: none; }
  .touchUI .tcBtns button.on { background: rgba(192,57,43,.85); }
  body:not([data-mode="drone"]) .touchUI .tcUp, body:not([data-mode="drone"]) .touchUI .tcDown { display: none; }
  body[data-mode="drone"] .touchUI .tcJump, body:not([data-mode]) .touchUI .tcJump { display: none; }
  body:not([data-mode]) .touchUI .tcUp, body:not([data-mode]) .touchUI .tcDown { display: block; }
  body.touch .minimap { bottom: calc(205px + env(safe-area-inset-bottom, 0px)); }
  .minimap .mmTabs { display: flex; gap: 2px; padding: 2px; border-radius: 7px; background: rgba(255,255,255,.08); }
  .minimap .mmTabs button { font: inherit; border: 0; border-radius: 5px; padding: 2px 7px; background: transparent; color: #cfd3d8; cursor: pointer; }
  .minimap .mmTabs button.on { background: #c0392b; color: #fff; }
  .minimap.closed canvas, .minimap.closed .mmTip, .minimap.closed .mmHead span { display: none; }
  #ui .panel.video { max-width: min(720px, 100%); }
  #ui .panel.show { max-width: min(560px, 100%); }
  #ui .showTimeline { flex-basis: 100%; display: flex; align-items: center; gap: 8px; }
  #ui .showTimeline input[type="range"] { flex: 1; min-width: 120px; accent-color: #e048b8; cursor: pointer; }
  #ui .showTime { color: #fff; font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #ui .showCueLabel { color: #ffd47a; font-size: 12px; max-width: 11em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #ui .showCues { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 4px; max-height: 58px; overflow: auto; }
  #ui .showCues[hidden] { display: none; }
  #ui .showCues button { font-size: 11.5px; padding: 3px 7px; background: rgba(255,255,255,.07); max-width: 13em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #ui .showCues button.on { background: #9b2fae; color: #fff; }
  #ui .showMeta { flex-basis: 100%; color: #ffb4b4; font-size: 11.5px; line-height: 1.45; }
  #ui .showMeta[hidden] { display: none; }
  #ui .file input { font-size: 11px; color: #cfd3da; max-width: 15em; }
  #ui .urlRow { display: inline-flex; gap: 4px; align-items: center; }
  #ui #vidUrl { font: inherit; font-size: 12.5px; width: clamp(180px, 30vw, 340px); padding: 5px 8px; border-radius: 7px; border: 0; background: rgba(255,255,255,.1); color: #fff; }
  #ui #vidUrl::placeholder { color: #9aa0a8; }
  #ui .vidStatus { flex-basis: 100%; color: #b9c0c9; font-size: 11.5px; line-height: 1.5; }
  #app > canvas { position: relative; z-index: 1; }   
  .css3d { z-index: 0; background: #000; }
  .css3d.interact { z-index: 3; background: transparent; }
  .labels { z-index: 2; }
  
  .vidSource { position: fixed; left: 0; bottom: 0; z-index: 0; pointer-events: none; }
  .vidSource .vsHead { display: none; }
  .vidSource.front { left: 12px; bottom: calc(50px + env(safe-area-inset-bottom, 0px)); z-index: 6; padding: 5px; border-radius: 10px; background: rgba(14,15,18,.82); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); color: #e6e9ee; font: 12px/1.3 "PingFang SC", system-ui, sans-serif; box-shadow: 0 4px 18px rgba(0,0,0,.3); pointer-events: auto; }
  .vidSource.front .vsHead { display: flex; gap: 8px; align-items: baseline; padding: 0 3px 5px; max-width: 320px; }
  .vidSource .vsTitle { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vidSource .vsTip { color: #9aa3ad; font-size: 11px; white-space: nowrap; }
  .vidSource .vsBody { position: relative; isolation: isolate; overflow: hidden; background: #000; }
  .vidSource .vsStage { position: absolute; left: 0; top: 0; }
  .vidSource .vsView { position: absolute; left: 0; overflow: hidden; isolation: isolate; background: #000; }
  .vidSource.front .vsView { overflow: visible; }   
  .vidSource iframe { position: absolute; left: 0; border: 0; }
  @media (max-width: 620px) { .hud { gap: 8px; font-size: 11px; padding: 5px 8px; } .hud > :nth-child(3), .hud > :nth-child(4), .hud > :nth-child(6) { display: none; } .minimap canvas { width: 150px !important; height: auto !important; } }
</style>
